name: check tickets

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a test email"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    permissions:
      actions: write
      contents: read
    steps:
      - name: Stop if another check is already running
        id: gate
        if: github.event.inputs.send_test != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5 6; do
            count=$(gh run list --repo "${{ github.repository }}" --workflow check.yml --status in_progress --json databaseId --jq 'length')
            echo "in progress: $count"
            if [ "$count" -le 1 ]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - uses: actions/cache/restore@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          path: state
          key: ticket-log-${{ github.run_id }}
          restore-keys: |
            ticket-log-

      - name: Check ticket page
        if: steps.gate.outputs.skip != 'true'
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST: ${{ github.event.inputs.send_test }}
          LOOP_MINUTES: ${{ github.event.inputs.send_test == 'true' && '0' || '240' }}
        run: python check.py

      - uses: actions/cache/save@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          path: state
          key: ticket-log-${{ github.run_id }}

      - name: Continue in a new run
        if: steps.gate.outputs.skip != 'true' && github.event.inputs.send_test != 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml --repo "${{ github.repository }}" --ref main -f send_test=false
